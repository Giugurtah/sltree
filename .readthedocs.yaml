# Read the Docs build configuration for SL-TREE.
#
# The docs import the package to read its docstrings, so the build installs it
# — which means compiling the three C backends.  build_c.py handles that, and
# the Ubuntu image already carries gcc.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: pip
      path: .
    - requirements: docs/requirements.txt

formats:
  - pdf
