[build-system]
requires = ["setuptools >= 77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "sltree"
version         = "0.1.0"
description     = "SL-TREE: interpretable tree models grounded in statistical learning theory, with predictability-driven growth, latent budget trees, visual pruning and non-parametric imputation"
readme          = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "numpy  >= 1.23",
    "pandas >= 1.5",
]

[project.optional-dependencies]
dev = ["pytest", "scikit-learn"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sltree*"]

[tool.setuptools.package-data]
"sltree._backend"                  = ["*.so", "*.dylib", "*.dll"]
"sltree._preprocessing._backend"  = ["*.so", "*.dylib", "*.dll"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Two tiers, per rOpenSci G5.10: the fast tier runs by default in about half a
# minute; `pytest --extended` adds the long-running ones.
markers = [
    "extended: long-running test; needs --extended to run",
]
filterwarnings = ["error::DeprecationWarning"]
